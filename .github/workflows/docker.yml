name: Build and publish image

# Builds a single-arch (linux/arm64) production image, publishes it to the
# GitHub Container Registry, then signs it with cosign (keyless OIDC) and
# attaches a SLSA build-provenance attestation.
#
# This workflow only publishes the image. Deploying it to fly.io is a separate,
# manual step:
#
#   fly deploy --image ghcr.io/<owner>/<repo>:<tag>
#
# See fly.toml for the app configuration.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing and for buildx provenance.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lowercase image reference
        # GHCR requires an all-lowercase repository path.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Short commit SHA on every build, e.g. `dd1239d`.
            type=sha,prefix=
            # Rolling `latest` on the default branch.
            type=raw,value=latest,enable={{is_default_branch}}
            # Semantic version on release, e.g. `1.2.3`.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM and a buildx provenance attestation to the image.
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless signing using the GitHub OIDC token; no private key to manage.
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: ./.github/actions/attest-provenance
        with:
          digest: ${{ steps.build.outputs.digest }}
